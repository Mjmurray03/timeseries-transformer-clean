apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timeseries-transformer-ingress
  namespace: timeseries-transformer
  labels:
    app: timeseries-transformer
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/rate-limit: "10"
    nginx.ingress.kubernetes.io/rate-limit-burst: "20"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.timeseries-transformer.com
    secretName: timeseries-transformer-tls
  rules:
  - host: api.timeseries-transformer.com
    http:
      paths:
      - path: /predict
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
      - path: /predict/batch
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
      - path: /model/info
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
      - path: /ready
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 8001
      - path: /docs
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
      - path: /openapi.json
        pathType: Exact
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: timeseries-transformer-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: timeseries-transformer-nodeport
  namespace: timeseries-transformer
  labels:
    app: timeseries-transformer
    component: nodeport
spec:
  type: NodePort
  selector:
    app: timeseries-transformer
    component: model-server
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30080
    protocol: TCP