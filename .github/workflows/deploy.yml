name: Deploy ML Model

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Cache TA-Lib
      id: cache-talib
      uses: actions/cache@v3
      with:
        path: /usr/local/lib/libta_lib*
        key: talib-${{ runner.os }}-0.4.0

    - name: Install TA-Lib system library
      if: steps.cache-talib.outputs.cache-hit != 'true'
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y build-essential wget
        
        # Download TA-Lib source with retry
        for i in {1..3}; do
          if wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz; then
            break
          fi
          echo "Download attempt $i failed, retrying..."
          sleep 5
        done
        
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make -j$(nproc)
        sudo make install
        sudo ldconfig
        cd ..
        rm -rf ta-lib*
        
        # Verify installation
        ls -la /usr/lib/libta_lib* || ls -la /usr/local/lib/libta_lib* || echo "TA-Lib installed successfully"

    - name: Setup TA-Lib from cache
      if: steps.cache-talib.outputs.cache-hit == 'true'
      run: sudo ldconfig

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry==1.7.1
        poetry config virtualenvs.create false
        poetry install --with dev

    - name: Run linting
      run: |
        poetry run black --check src/ tests/
        poetry run isort --check-only src/ tests/
        poetry run flake8 src/ tests/

    - name: Run type checking
      run: |
        poetry run mypy src/

    - name: Run security checks
      run: |
        poetry run bandit -r src/
        poetry run safety check

    - name: Run tests with coverage
      run: |
        poetry run pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=term \
          --cov-fail-under=80 \
          --junitxml=pytest.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Upload test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: pytest
        path: pytest.xml
        reporter: java-junit

  build:
    name: Build and Push Container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deployment/docker/Dockerfile
        target: inference
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64
        build-args: |
          BUILDKIT_INLINE_CACHE=1

  security-scan:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ needs.build.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    needs: [test, build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment: staging
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name staging-cluster --region us-west-2

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Deploy with Helm
      run: |
        helm upgrade --install timeseries-transformer \
          ./deployment/helm \
          --namespace timeseries-transformer \
          --create-namespace \
          --values deployment/helm/values-staging.yaml \
          --set image.tag=${{ github.sha }} \
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
          --wait \
          --timeout 600s

    - name: Run smoke tests
      run: |
        kubectl wait --for=condition=ready pod -l app=timeseries-transformer -n timeseries-transformer --timeout=300s
        kubectl port-forward -n timeseries-transformer svc/timeseries-transformer 8080:80 &
        sleep 10
        curl -f http://localhost:8080/health || exit 1
        curl -f http://localhost:8080/ready || exit 1

    - name: Post deployment notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ml-deployments'
        text: 'Staging deployment ${{ job.status }}: ${{ github.sha }}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: Deploy to Production
    needs: [test, build, security-scan]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name production-cluster --region us-west-2

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Pre-deployment validation
      run: |
        python deployment/ci-cd/validate-deployment.py \
          --model-path models/latest \
          --requirements deployment/validation-requirements.yaml

    - name: Deploy with Helm (Canary)
      run: |
        # Deploy canary version (10% traffic)
        helm upgrade --install timeseries-transformer-canary \
          ./deployment/helm \
          --namespace timeseries-transformer \
          --create-namespace \
          --values deployment/helm/values-prod.yaml \
          --set replicaCount=1 \
          --set image.tag=${{ github.ref_name || github.sha }} \
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
          --set ingress.annotations."nginx\.ingress\.kubernetes\.io/canary"="true" \
          --set ingress.annotations."nginx\.ingress\.kubernetes\.io/canary-weight"="10" \
          --wait \
          --timeout 600s

    - name: Run canary tests
      run: |
        python deployment/ci-cd/canary-tests.py \
          --endpoint https://api.timeseries-transformer.com \
          --duration 300 \
          --success-rate 99.5

    - name: Full production deployment
      run: |
        # Deploy full production version
        helm upgrade --install timeseries-transformer \
          ./deployment/helm \
          --namespace timeseries-transformer \
          --values deployment/helm/values-prod.yaml \
          --set image.tag=${{ github.ref_name || github.sha }} \
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
          --wait \
          --timeout 900s

        # Remove canary deployment
        helm uninstall timeseries-transformer-canary -n timeseries-transformer || true

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/timeseries-transformer -n timeseries-transformer --timeout=600s

    - name: Run production smoke tests
      run: |
        python deployment/ci-cd/production-tests.py \
          --endpoint https://api.timeseries-transformer.com \
          --test-suite comprehensive

    - name: Update model registry
      run: |
        python scripts/update-model-registry.py \
          --version ${{ github.ref_name || github.sha }} \
          --status deployed \
          --environment production

    - name: Post deployment notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ml-deployments'
        text: |
          Production deployment ${{ job.status }}: ${{ github.ref_name || github.sha }}
          Deployment time: ${{ steps.deployment.outputs.time }}
          Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name || github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup:
    name: Cleanup Resources
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cleanup old container images (keep last 10)
      env:
        OWNER: ${{ github.repository_owner }}
        PACKAGE: timeseries-transformer
        TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        
        # Normalize line endings to prevent CRLF issues
        find . -type f -name "*.sh" -print0 2>/dev/null | xargs -0 sed -i 's/\r$//' || true
        
        # Determine if owner is user or organization
        OWNER_TYPE=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/users/$OWNER" | jq -r '.type // "User"')
        
        if [[ "$OWNER_TYPE" == "Organization" ]]; then
          API_BASE="https://api.github.com/orgs/$OWNER"
        else
          API_BASE="https://api.github.com/users/$OWNER"
        fi
        
        API="$API_BASE/packages/container/$PACKAGE/versions?per_page=100"
        
        echo "Fetching container versions from: $API"
        
        # Get all version IDs sorted by created date (newest first)
        IDS=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$API" \
          | jq -r 'sort_by(.created_at) | reverse | .[].id' 2>/dev/null || echo "")
        
        if [[ -z "$IDS" ]]; then
          echo "No container versions found or API call failed"
          exit 0
        fi
        
        KEEP=10
        i=0
        deleted=0
        
        echo "Found versions, keeping newest $KEEP, deleting rest..."
        
        for id in $IDS; do
          i=$((i+1))
          if [ $i -le $KEEP ]; then
            echo "Keeping version $id (rank $i)"
            continue
          fi
          
          echo "Deleting version $id (rank $i)"
          
          if curl -fsSL -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_BASE/packages/container/$PACKAGE/versions/$id" \
            -o /dev/null; then
            deleted=$((deleted+1))
            echo "Successfully deleted version $id"
          else
            echo "Failed to delete version $id (may lack permissions or version already deleted)"
          fi
        done
        
        echo "Cleanup complete: deleted $deleted old versions, kept $KEEP newest versions"