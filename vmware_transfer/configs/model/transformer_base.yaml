# Base Transformer Model Configuration
# Time-Series Transformer for Stock Prediction

model_type: "transformer"

# Transformer Architecture
transformer:
  d_model: 256
  n_heads: 8
  n_layers: 6
  dropout: 0.1
  max_seq_length: 60
  forecast_horizon: 5
  activation: "gelu"
  layer_norm_eps: 1e-5

# General Architecture Configuration
architecture:
  input_features: 7  # OHLCV + Volume + 2 technical indicators
  output_features: 1  # Close price prediction
  hidden_dim: 256
  num_layers: 6
  attention_heads: 8
  dropout_rate: 0.1
  use_positional_encoding: true
  positional_encoding_type: "sinusoidal"  # sinusoidal, learned

# Loss Function Configuration
loss:
  primary_loss: "mse"  # mse, mae, huber, quantile
  loss_weights:
    regression: 0.7
    direction: 0.3
  quantile_levels: [0.1, 0.25, 0.5, 0.75, 0.9]
  huber_delta: 1.0

# Regularization
regularization:
  weight_decay: 1e-4
  gradient_clipping: true
  max_grad_norm: 1.0
  label_smoothing: 0.0
  mixup_alpha: 0.0  # 0.0 disables mixup

# Optimization
optimization:
  optimizer: "adamw"
  learning_rate: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  scheduler: "cosine_annealing"
  warmup_steps: 1000
  min_lr: 1e-6

# Training Configuration
training:
  batch_size: 32
  accumulation_steps: 4  # Effective batch size = 128
  mixed_precision: true
  compile_model: false  # torch.compile (requires PyTorch 2.0+)