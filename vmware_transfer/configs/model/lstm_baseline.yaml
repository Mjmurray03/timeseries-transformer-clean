# LSTM Baseline Model Configuration
# For comparison with Transformer model

model_type: "lstm"

# LSTM Architecture
lstm:
  hidden_size: 128
  num_layers: 2
  dropout: 0.1
  bidirectional: false
  batch_first: true

# General Architecture Configuration
architecture:
  input_features: 7
  output_features: 1
  hidden_dim: 128
  dropout_rate: 0.1

# Loss Function Configuration
loss:
  primary_loss: "mse"
  loss_weights:
    regression: 1.0
  quantile_levels: [0.1, 0.5, 0.9]
  huber_delta: 1.0

# Regularization
regularization:
  weight_decay: 1e-3
  gradient_clipping: true
  max_grad_norm: 1.0
  label_smoothing: 0.0
  mixup_alpha: 0.0

# Optimization
optimization:
  optimizer: "adam"
  learning_rate: 1e-3
  betas: [0.9, 0.999]
  eps: 1e-8
  scheduler: "step_lr"
  step_size: 30
  gamma: 0.1

# Training Configuration
training:
  batch_size: 64
  accumulation_steps: 2
  mixed_precision: false
  compile_model: false