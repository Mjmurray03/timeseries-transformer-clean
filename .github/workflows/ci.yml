name: Test and Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Normalize line endings for shell scripts
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 sed -i 's/\r$//'

      - name: Cache TA-Lib build
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: talib-${{ runner.os }}-v1

      - name: Install TA-Lib system library
        env:
          TA_VERSION: "0.4.0"
        run: |
          chmod +x scripts/ci/install_talib.sh
          scripts/ci/install_talib.sh

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install "poetry<2"

      - name: Configure Poetry (no venv in CI)
        run: |
          poetry config virtualenvs.create false
          poetry --version

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Run linting
        continue-on-error: true
        run: |
          if [ -f "pyproject.toml" ]; then
            poetry run ruff check . || true
          fi

      - name: Run type checking
        continue-on-error: true
        run: |
          if [ -f "pyproject.toml" ]; then
            poetry run mypy . || true
          fi

      - name: Run security checks
        continue-on-error: true
        run: |
          poetry run bandit -r src/ || true

      - name: Run tests with coverage (always emit JUnit)
        continue-on-error: true
        run: |
          mkdir -p reports
          poetry run pytest -q --maxfail=1 --disable-warnings --junitxml=reports/pytest.xml --cov=src --cov-report=xml --cov-report=term || true

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: pytest
          path: reports/pytest.xml
          reporter: java-junit

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true