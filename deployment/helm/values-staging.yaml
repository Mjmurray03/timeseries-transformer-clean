# Staging environment values
replicaCount: 2

image:
  tag: "staging"

service:
  type: LoadBalancer

ingress:
  enabled: true
  hosts:
    - host: staging-api.timeseries-transformer.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: timeseries-transformer-staging-tls
      hosts:
        - staging-api.timeseries-transformer.com

resources:
  limits:
    cpu: 1500m
    memory: 3Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 750m
    memory: 1.5Gi
    nvidia.com/gpu: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5

persistence:
  size: 25Gi

env:
  - name: LOG_LEVEL
    value: "INFO"
  - name: ENVIRONMENT
    value: "staging"

postgresql:
  persistence:
    size: 50Gi

redis:
  master:
    persistence:
      size: 5Gi
  replica:
    replicaCount: 1

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: false