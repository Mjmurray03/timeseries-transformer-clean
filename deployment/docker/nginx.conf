user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=batch_limit:10m rate=1r/s;

    # Connection limits
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 100;

    # Cache settings
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=model_cache:10m max_size=1g inactive=60m use_temp_path=off;
    
    # Upstream configuration with load balancing
    upstream model_backend {
        least_conn;
        
        # API instances
        server api:8000 weight=3 max_fails=3 fail_timeout=30s;
        
        # Health check
        keepalive 32;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name api.timeseries-transformer.com;
        return 301 https://$server_name$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name api.timeseries-transformer.com;

        # SSL Configuration (uncomment when certificates are available)
        # ssl_certificate /etc/nginx/certs/cert.pem;
        # ssl_certificate_key /etc/nginx/certs/key.pem;
        # ssl_protocols TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'";

        # Request size limits
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # Default proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Health check endpoint (no rate limiting, no logging)
        location /health {
            proxy_pass http://model_backend/health;
            access_log off;
            proxy_cache off;
        }

        # Readiness check endpoint
        location /ready {
            proxy_pass http://model_backend/ready;
            access_log off;
            proxy_cache off;
        }

        # Metrics endpoint (restricted access)
        location /metrics {
            # Allow only from monitoring network
            allow 172.16.0.0/12;
            deny all;
            
            proxy_pass http://model_backend/metrics;
            access_log off;
        }

        # Single prediction endpoint
        location /predict {
            limit_req zone=predict_limit burst=20 nodelay;
            
            proxy_pass http://model_backend/predict;
            
            # Caching for identical requests
            proxy_cache model_cache;
            proxy_cache_key "$request_method$request_uri$request_body";
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            
            # Add cache status to response headers
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Batch prediction endpoint
        location /predict/batch {
            limit_req zone=batch_limit burst=5 nodelay;
            
            proxy_pass http://model_backend/predict/batch;
            
            # Longer timeout for batch processing
            proxy_read_timeout 120s;
            
            # No caching for batch predictions
            proxy_cache off;
        }

        # Model information endpoint
        location /model/info {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://model_backend/model/info;
            
            # Cache model info for longer
            proxy_cache model_cache;
            proxy_cache_valid 200 1h;
        }

        # WebSocket endpoint for streaming predictions
        location /ws/predict {
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://model_backend/ws/predict;
            
            # WebSocket specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Longer timeout for WebSocket
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # No caching for WebSocket
            proxy_cache off;
        }

        # API documentation
        location /docs {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://model_backend/docs;
        }

        # OpenAPI schema
        location /openapi.json {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://model_backend/openapi.json;
            
            # Cache OpenAPI spec
            proxy_cache model_cache;
            proxy_cache_valid 200 1h;
        }

        # Default location (catch-all)
        location / {
            return 404;
        }

        # Error pages
        error_page 404 /404.json;
        location = /404.json {
            internal;
            default_type application/json;
            return 404 '{"error": "Not Found", "message": "The requested endpoint does not exist"}';
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 500 '{"error": "Internal Server Error", "message": "The server encountered an error"}';
        }

        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please try again later"}';
        }
    }

    # Status page (internal only)
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}