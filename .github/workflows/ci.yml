name: Test and Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget automake autoconf libtool pkg-config

      - name: Cache TA-Lib build
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: talib-${{ runner.os }}-v1

      - name: Install TA-Lib system library
        run: |
          chmod +x scripts/ci/install_talib.sh
          scripts/ci/install_talib.sh

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install "poetry<2"

      - name: Configure Poetry (no venv in CI)
        run: poetry config virtualenvs.create false

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run linting
        continue-on-error: true
        run: |
          poetry run black --check src/ tests/ || true
          poetry run isort --check-only src/ tests/ || true
          poetry run flake8 src/ tests/ || true

      - name: Run type checking
        continue-on-error: true
        run: poetry run mypy src/ || true

      - name: Run security checks
        continue-on-error: true
        run: |
          poetry run bandit -r src/ || true
          poetry run safety check || true

      - name: Run tests with coverage (always emit JUnit)
        continue-on-error: true
        run: |
          mkdir -p reports
          poetry run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=80 \
            --junitxml=reports/pytest.xml || true

      - name: Upload test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: pytest
          path: reports/pytest.xml
          reporter: java-junit

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true