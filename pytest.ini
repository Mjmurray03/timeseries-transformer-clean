[tool:pytest]
# Pytest configuration following testing-standards.md
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for organization
markers =
    unit: Unit tests (fast) - 75% of test pyramid
    integration: Integration tests (slower) - 20% of test pyramid  
    performance: Performance benchmarks - 5% of test pyramid
    smoke: Smoke tests for deployment verification
    gpu: Tests requiring GPU acceleration
    slow: Tests taking > 1 second
    memory: Memory leak and usage tests
    load: Load testing with concurrent operations

# Coverage configuration following testing-standards.md requirements
addopts = 
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --tb=short
    -ra
    --color=yes

# Minimum coverage targets per component
cov-fail-under = 80

# Filter warnings to reduce noise
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Pytest timeout for long-running tests
timeout = 300

# Test discovery patterns
minversion = 6.0